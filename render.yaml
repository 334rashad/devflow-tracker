databases:
  - name: devflow-db
    plan: free
    databaseName: devflow
    user: devflow

services:
  - type: web
    name: devflow-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: devflow-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://devflow-frontend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://devflow-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: devflow-db
          property: connectionString

  - type: web
    name: devflow-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://devflow-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
